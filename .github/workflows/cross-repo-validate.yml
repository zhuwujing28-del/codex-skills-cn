name: cross-repo-validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Keep manual cross-repo validation stable across runner migrations.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codex-skills-cn
        uses: actions/checkout@v7

      - name: Checkout agent-evals-cn
        uses: actions/checkout@v7
        with:
          repository: zhuwujing28-del/agent-evals-cn
          path: agent-evals-cn
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate both repositories
        shell: pwsh
        run: ./scripts/validate-cross-repo.ps1 -AgentEvalsPath ./agent-evals-cn
